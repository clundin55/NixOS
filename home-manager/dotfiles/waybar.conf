{
    "modules-center": ["hyprland/workspaces"],
    "modules-right": ["custom/vpn", "custom/stock", "custom/weather", "network", "pulseaudio", "custom/music", "clock"],
    "modules-left": ["cpu", "memory", "custom/gpu"],

    "custom/stock": {
        "exec": "cat ~/.local/share/stock-price/stock.json",
        "return-type": "json",
        "format": "{}",
        "tooltip": true,
        "interval": 30
    },

    "bluetooth": {
        "format": "  {status}",
        "format-disabled": "",
        "format-connected": " {num_connections} connected",
        "tooltip-format": "{controller_alias}\t{controller_address}",
        "tooltip-format-connected": "{controller_alias}\t{controller_address}\n\n{device_enumerate}",
        "tooltip-format-enumerate-connected": "{device_alias}\t{device_address}"
    },
    "clock": {
        "format": "{:%H:%M %D}",
    },
    "cpu": {
        "format": "cpu: {usage}%",
    },
    "memory": {
        "format": "mem: {percentage}%",
    },
    "custom/gpu": {
        "exec": "cat /sys/class/hwmon/hwmon7/device/gpu_busy_percent",
        "format": "gpu: {}%",
        "interval": 15
    },
    "custom/music": {
        "exec": "echo \"$(playerctl metadata artist) - $(playerctl metadata title)\"",
        "format": "{}",
        "interval": 15
    },
    "custom/weather": {
        "exec": "cat ~/.local/share/weather/weather.json",
        "return-type": "json",
        "format": "{}",
        "tooltip": true,
        "interval": 30,
    },
    "custom/vpn": {
        "exec": "vpn-status.sh",
        "format": "{}",
        "interval": 15,
        "signal": 5,
        "menu": "on-click",
        "menu-file": "~/.config/waybar/vpn-menu.xml",
        "menu-actions": {
            "vpn-tailscale": "vpn-switch tailscale",
            "vpn-seattle": "vpn-switch seattle",
            "vpn-stockholm": "vpn-switch stockholm",
            "vpn-barcelona": "vpn-switch barcelona",
            "vpn-off": "vpn-switch off"
        },
    },
    "disk": {
        "format": "free disk: {percentage_free}%",
    },
    "hyprland/workspaces": {
      "format": "{name}",
      "on-click": "activate",
      "format-icons": {
        "active": "",
        "default": ""
      },
      "sort-by-number": true
    },
    "network": {
        "interface": "wlp14s0",
        "format": "{ifname}",
        "format-wifi": "{essid} ({signalStrength}%) ",
        "format-ethernet": "{ipaddr}/{cidr} 󰊗",
        "format-disconnected": "",
        "tooltip-format": "{ifname} via {gwaddr} 󰊗",
        "tooltip-format-wifi": "{essid} ({signalStrength}%) ",
        "tooltip-format-ethernet": "{ifname} ",
        "tooltip-format-disconnected": "Disconnected",
        "max-length": 50
    },
    "pulseaudio": {
        "format": "{volume}% {icon}",
        "format-bluetooth": "{volume}% {icon}",
        "format-muted": "",
        "format-icons": {
            "alsa_output.pci-0000_00_1f.3.analog-stereo": "",
            "alsa_output.pci-0000_00_1f.3.analog-stereo-muted": "",
            "headphone": "",
            "hands-free": "",
            "headset": "",
            "phone": "",
            "phone-muted": "",
            "portable": "",
            "car": "",
            "default": ["", ""]
        },
        "scroll-step": 1,
        "menu": "on-click",
        "menu-file": "~/.config/waybar/audio-menu.xml",
        "menu-actions": {
            "sink-headphones": "pw-metadata -n default 0 default.audio.sink '{\"name\":\"alsa_output.usb-Generic_USB_Audio-00.HiFi__Headphones__sink\"}'",
            "sink-speakers": "pw-metadata -n default 0 default.audio.sink '{\"name\":\"alsa_output.usb-Generic_USB_Audio-00.HiFi__Speaker__sink\"}'",
            "sink-spdif": "pw-metadata -n default 0 default.audio.sink '{\"name\":\"alsa_output.usb-Generic_USB_Audio-00.HiFi__SPDIF__sink\"}'",
            "sink-dell": "pw-metadata -n default 0 default.audio.sink '{\"name\":\"alsa_output.usb-Dell_U3224KB_A_CF3TV383013L-00.analog-stereo\"}'",
            "sink-hdmi": "pw-metadata -n default 0 default.audio.sink '{\"name\":\"alsa_output.pci-0000_03_00.1.hdmi-stereo\"}'"
        },
        "on-click-right": "pavucontrol",
        "on-click-middle": "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle",
        "tooltip-format": "{desc} — {volume}%",
        "ignored-sinks": ["Easy Effects Sink"]
    }
}
